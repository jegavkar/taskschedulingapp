<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>TaskFlow</h3>
      </div>
      <ul class="sidebar-menu">
        <li class="active" data-view="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</li>
        <li data-view="daily"><i class="bi bi-calendar-day"></i> Daily View</li>
        <li data-view="weekly"><i class="bi bi-calendar-week"></i> Weekly View</li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn btn-sm">
          <i class="bi bi-moon-fill"></i> Dark Mode
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <button id="sidebar-toggle" class="btn btn-sm">
          <i class="bi bi-list"></i>
        </button>
        <div class="top-bar-title">Dashboard</div>
        <button id="add-task-btn" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Add Task
        </button>
      </div>

      <!-- Dashboard View -->
      <div class="content-view active" id="dashboard-view">
        <div class="filter-bar">
          <div class="row align-items-center">
            <div class="col-md-3">
              <select id="sort-by" class="form-select">
                <option value="date">Sort by Date</option>
                <option value="priority">Sort by Priority</option>
              </select>
            </div>
            <div class="col-md-3">
              <select id="filter-category" class="form-select">
                <option value="all">All Categories</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="date" id="filter-date" class="form-control">
            </div>
            <div class="col-md-3">
              <button id="clear-filters" class="btn btn-outline-secondary w-100">Clear Filters</button>
            </div>
          </div>
        </div>

        <div class="tasks-container" id="tasks-container">
          <!-- Tasks will be added here dynamically -->
          <div class="no-tasks-message">No tasks found. Add a new task to get started!</div>
        </div>
      </div>

      <!-- Daily View -->
      <div class="content-view" id="daily-view">
        <div class="date-navigator">
          <button id="prev-day" class="btn btn-sm btn-outline-primary"><i class="bi bi-chevron-left"></i></button>
          <h4 id="current-date">Today</h4>
          <button id="next-day" class="btn btn-sm btn-outline-primary"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="daily-timeline" id="daily-timeline">
          <!-- Daily tasks will be added here -->
        </div>
      </div>

      <!-- Weekly View -->
      <div class="content-view" id="weekly-view">
        <div class="date-navigator">
          <button id="prev-week" class="btn btn-sm btn-outline-primary"><i class="bi bi-chevron-left"></i></button>
          <h4 id="current-week">This Week</h4>
          <button id="next-week" class="btn btn-sm btn-outline-primary"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="weekly-calendar" id="weekly-calendar">
          <!-- Weekly calendar will be generated here -->
        </div>
      </div>

      <!-- Task Details View -->
      <div class="content-view" id="task-details-view">
        <div class="task-details-container">
          <h3 id="task-details-title">Task Title</h3>
          <div class="task-details-info">
            <p><strong>Description:</strong> <span id="task-details-description">No description</span></p>
            <p><strong>Date & Time:</strong> <span id="task-details-datetime">Date</span></p>
            <p><strong>Priority:</strong> <span id="task-details-priority">Priority</span></p>
            <p><strong>Category:</strong> <span id="task-details-category">Category</span></p>
            <p><strong>Status:</strong> <span id="task-details-status">Status</span></p>
          </div>
          <div class="task-details-actions">
            <button id="edit-task-btn" class="btn btn-primary">Edit Task</button>
            <button id="toggle-status-btn" class="btn btn-success">Mark as Completed</button>
            <button id="delete-task-btn" class="btn btn-danger">Delete Task</button>
            <button id="back-to-dashboard" class="btn btn-secondary">Back to Dashboard</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="task-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="task-modal-title">Add New Task</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="task-form">
              <input type="hidden" id="task-id">
              <div class="mb-3">
                <label for="task-title" class="form-label">Title</label>
                <input type="text" class="form-control" id="task-title" required>
              </div>
              <div class="mb-3">
                <label for="task-description" class="form-label">Description (optional)</label>
                <textarea class="form-control" id="task-description" rows="3"></textarea>
              </div>
              <div class="mb-3">
                <label for="task-date" class="form-label">Date</label>
                <input type="date" class="form-control" id="task-date" required>
              </div>
              <div class="mb-3">
                <label for="task-time" class="form-label">Time</label>
                <input type="time" class="form-control" id="task-time" required>
              </div>
              <div class="mb-3">
                <label for="task-priority" class="form-label">Priority</label>
                <select class="form-select" id="task-priority" required>
                  <option value="Low">Low</option>
                  <option value="Medium">Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="task-category" class="form-label">Category</label>
                <select class="form-select" id="task-category" required>
                  <option value="Work">Work</option>
                  <option value="Study">Study</option>
                  <option value="Personal">Personal</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="save-task-btn">Save Task</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
